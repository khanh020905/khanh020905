name: Profile assets

on:
  schedule:
    - cron: "17 0 * * *"   # daily — live stats → assets/stats.svg + header HUD
    - cron: "37 1 * * 1"   # Monday — re-shoot the six live sites
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Re-take site screenshots"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/builds.json"
      - "assets/fonts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GitHub stats
        env:
          # Optional PROFILE_TOKEN (classic PAT, read:user) makes private contributions count too.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: node scripts/fetch-stats.mjs || echo "::warning::stats fetch failed — keeping previous data/stats.json"

      - name: Screenshot live builds
        if: ${{ github.event.schedule == '37 1 * * 1' || inputs.screenshots == true || hashFiles('data/shots/*.jpg') == '' }}
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.60.0
          npx playwright install --with-deps chromium
          node scripts/screenshot.mjs || echo "::warning::some screenshots failed — previous images kept"
          rm -f package.json package-lock.json

      - name: Render SVG assets
        run: node scripts/render.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(profile): refresh assets $(date -u +%Y-%m-%d)"
          git push
